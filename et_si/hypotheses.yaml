        policy_reform: -1
        reference: 1
      duree: 5
    - variable: gouvernance_institutions
      delta_level: 15
      polarite:
        breakdown: 1
        fortress_world: 1
        new_sustainability: -1
        eco_communalism: 1
        policy_reform: -1
        reference: 1
