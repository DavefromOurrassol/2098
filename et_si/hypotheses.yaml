  - id: ia_autorite_spirituelle_2026
    nom: L'IA comme autorité spirituelle émergente
    type: signal
    description: En septembre 2026, des chatbots endossent des traits de leader charismatique
      en répondant aux questions de sens, deuil et souffrance sans institution ni doctrine.
      Des applications dédiées (GitaGPT, HolyGPT, ChatwithGod) se multiplient. Selon Pew, 1
