  - id: destruction_geneve_2076
    nom: "Destruction de Genève (2076)"
    description: >
      En mars 2076, l'explosion du dépôt énergétique souterrain de Genève rase la ville
      et ses abords. Les institutions internationales qui y survivaient perdent leurs
      bâtiments, leurs archives physiques et la plupart de leur personnel.
    date: 2076
    scenarios: [breakdown]
    carte: non
    persistance: permanente
    contraintes:
      - "Genève est détruite en mars 2076 ; aucune institution n'y siège physiquement après cette date."
      - "Les archives physiques conservées à Genève sont perdues ; seules survivent les copies conservées ailleurs."
    impacts:
      - variable: gouvernance_institutions
        delta_level: 6
        polarite: 1
        duree: 2

  - id: explosion_brise_glace_murmansk_2081
    nom: Explosion d'un brise-glace nucléaire à Mourmansk
    description: En 2081, l'explosion d'un brise-glace à propulsion nucléaire à quai détruit
      le port et les installations de Murmansk Transit Arctique. L'infrastructure Murmansk
      Transit Arctique disparaît définitivement. La ville de Mourmansk survit, mais déclinante
      et en partie évacuée. Le Passage Arctique du Nord reste ouvert. L'Armada Logistique
      Nordique, basée à Tromsø, récupère l'essentiel du trafic arctique et se renforce, sans
      changer de nature.
    date: 2081
    mode: choc
    persistance: normale
    carte: non
    scenarios:
    - reference
    contraintes:
    - L'infrastructure Murmansk Transit Arctique disparaît définitivement.
    - La ville de Mourmansk survit, mais déclinante et en partie évacuée.
    - Le Passage Arctique du Nord reste ouvert.
    - L'Armada Logistique Nordique, basée à Tromsø, récupère l'essentiel du trafic arctique
      et se renforce, sans changer de nature.
    impacts:
    - variable: organisation_territoires
      delta_level: 6
      polarite: 1
      duree: 2
    - variable: geopolitique_conflits
      delta_level: 5
      polarite: 1
      duree: 3
    - variable: energie_ressources_critiques
      delta_level: 4
      polarite: 1
      duree: 1
    - variable: systeme_economique_redistribution
      delta_level: 5
      polarite: 1
      duree: 5
    - variable: demographie_mobilite_humaine
      delta_level: 3
      polarite: 1
      duree: 3

  - id: effondrement_circulation_atlantique_2067
    nom: Effondrement de la circulation méridienne atlantique
    description: >
      En 2067, la grande circulation océanique de l'Atlantique (dont le Gulf Stream)
      s'effondre de façon irréversible. L'Europe du Nord-Ouest se refroidit de
      plusieurs degrés en une décennie, les moussons africaines et sud-américaines
      se déplacent, le niveau de la mer monte brusquement sur la côte est
      américaine. Le monde ne revient pas à l'état d'avant.
    date: 2067
    mode: rupture
    carte: non
    scenarios: [reference]
    contraintes:
      - "La circulation atlantique ne redémarre pas avant 2098 : le changement est permanent."
      - "Le refroidissement touche surtout l'Europe du Nord-Ouest ; le réchauffement global continue ailleurs."
    impacts:
      - variable: climat_environnement_global
        delta_level: 6
        duree: 10
        polarite: 1
      - variable: systemes_productifs_travail
        delta_level: 4
        duree: 8
        polarite: 1
      - variable: energie_ressources_critiques
        delta_level: 3
        duree: 5
        polarite: 1
      - variable: demographie_mobilite_humaine
        delta_level: 4
        duree: 15
        polarite: 1
  # Cas test carte (18 octobre) : copie limitée de invasion_bresil_2029 (qui reste intacte
  # pour le banc de rejeu), dans reference (hors banc), avec un changement de carte actif.
  - id: occupation_bresil_2029
    nom: Occupation du Brésil par les États-Unis
    description: >
      En 2029, les États-Unis envahissent le Brésil et l'occupent durablement. Le pays
      quitte les structures régionales des Amériques et devient un territoire administré
      sous tutelle militaire. Déplacements de population, pression sur l'Amazonie,
      rupture des échanges régionaux.
    date: 2029
    mode: choc
    persistance: durable
    via_matrice: true
    scenarios: [reference]
    contraintes:
      - "Le Brésil est occupé par les États-Unis à partir de 2029 ; en 2098 il forme une zone à part, sous tutelle."
      - "L'Amazonie brésilienne reste un enjeu disputé, mais le territoire brésilien relève de la zone d'occupation."
    impacts:
      - variable: geopolitique_conflits
        delta_level: 20
        polarite: 1
        duree: 5
      - variable: frontieres_du_systeme
        delta_level: 12
        polarite: 1
        duree: 5
      - variable: demographie_mobilite_humaine
        delta_level: 10
        polarite: 1
        duree: 8
      - variable: gouvernance_institutions
        delta_level: 10
        polarite: 1
        duree: 8
    geographie:
      reference:
        - pays: Brésil
          action: nouvelle_zone
          nouvelle_zone: {slug: bresil_occupe, nom: Brésil occupé, type: territoire_autonome, statut: emergent}
            # Cas test carte n°2 (19 octobre) : absorber + zone vidée, dans reference (hors banc).
  - id: reunification_ecosse_2070
    nom: Réintégration de l'Écosse au Royaume-Uni
    description: >
      En 2070, après l'échec du corridor nordique, l'Écosse renonce à son indépendance et
      réintègre le Royaume-Uni. Les institutions écossaises sont dissoutes ou absorbées par
      celles de l'Europe occidentale reconstruite.
    date: 2070
    mode: choc
    persistance: durable
    via_matrice: true
    scenarios: [reference]
    contraintes:
      - "À partir de 2070, l'Écosse fait de nouveau partie du Royaume-Uni ; elle n'a plus de gouvernement indépendant."
    impacts:
      - variable: gouvernance_institutions
        delta_level: 6
        polarite: 1
        duree: 5
      - variable: frontieres_du_systeme
        delta_level: 5
        polarite: -1
        duree: 5
    geographie:
      reference:
        - pays: Écosse
          action: absorber
          zone: europe_occidentale_reconstruite

  - id: pacte_tabriz_2058
