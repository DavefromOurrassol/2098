    description: Enclave militarisée contrôlant les dernières banques génomiques de
      la biosphère amazonienne, gouvernée par une junte biotechnologique associant
      élites autochtones, mercenaires généticiens et drones de surveillance. Les stations
      flottantes, désormais blindées et équipées de systèmes anti-drones, servent
      de coffres-forts mobiles pour les échantillons critiques. Le territoire est
      verrouillé par des champs de mines phytosanitaires et des essaims de micro-drones
      tueurs, interdisant toute intrusion non autorisée.
    statut: stable
    tensions_internes: Conflits récurrents entre les gardiens autochtones des sanctuaires
      génétiques et les technocrates du Pacte, qui monétisent discrètement l'accès
      aux données pour financer la militarisation. Les cartels biopirates et les consortiums
      miniers lancent des raids éclair depuis les zones grises périphériques.
    periode_transition: 2041-2098
    evenement_transition: null
    lieux_emblematiques:
    - nom: Stations flottantes du Pacte Vert
      type: infrastructure
      notes: Postes de commandement mobiles déplacés tous les 72h pour éviter les
        frappes de drones de reconnaissance des cartels
