    description: Singapour est devenue une cité-État hyper-sécurisée, gouvernée par
      une IA de gestion des ressources et une élite technocratique militarisée. Elle
      sert de hub stratégique verrouillé pour le Bloc Pacifique Nord, contrôlant les
      flux financiers, logistiques et technologiques de la région avec une surveillance
      orbitale renforcée.
    tensions_internes: Inégalités sociales extrêmes entre l'élite technocratique et
