    description: Zone américaine fragmentée entre les États-Unis traversés par une
      crise politique majeure (élection contestée de 2055 et polarisation institutionnelle),
      São Paulo comme métropole-monde dominant les flux économiques sud-américains,
      et Valparaíso comme hub logistique secondaire pour les corridors Pacifique-Atlantique.
      Guadalajara reste un centre médical et biotechnologique de premier plan, intégré
      aux réseaux nord-américains.
    statut: fragmenté
    tensions_internes: Polarisation politique extrême aux États-Unis post-2055, réformes
      bloquées par l'opposition institutionnelle. Tensions entre les mégapoles (São
      Paulo, Mexico, New York) et les périphéries en déclin, notamment dans les zones
      rurales et les anciennes régions industrielles.
    periode_transition: 2026-2060
    evenement_transition: election_parti_commun_americain_reference
