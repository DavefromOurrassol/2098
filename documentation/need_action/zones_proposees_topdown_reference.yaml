    nom: Bloc Persique Autonome
    niveau: 1
    type: union_regionale
    parent: null
    statut: stable
    description: Coalition régionale centrée sur les ressources pétrolières et gazières
      du Golfe Persique, structurée autour d'un condominium énergétique partagé entre
      Téhéran et Riyad. Fonctionne comme un hub logistique et financier pour les flux
      eurasiatiques, malgré des tensions internes persistantes.
    tensions_internes: Rivalités entre élites technocratiques iraniennes et saoudiennes
      pour le contrôle des infrastructures critiques, atténuées par une gouvernance
      conjointe des ressources.
    periode_transition: 2035-2080
    evenement_transition: Révolution énergétique du Golfe 2040 et fragmentation de
      l'Arabie saoudite.
    lieux_emblematiques:
    - Téhéran (siège du Conseil Persique)
    - Bassora (port stratégique)
    - Chiraz (centre culturel)
    relations:
