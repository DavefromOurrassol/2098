  proposition:
    slug: inde_bassins_sacres
    nom: Inde — Bassins Sacrés
    niveau: 1
    type: union_regionale
    parent: null
    statut: stable
    description: Confédération de bioterritoires organisés autour des grands fleuves
      indiens (Gange, Yamuna, Godavari), structurée en assemblées locales de bassin
      versant. Les anciennes métropoles ont été démantelées au profit de réseaux de
      petites communautés agroécologiques et de centres culturels décentralisés.
    tensions_internes: Conflits interrégionaux sur l'accès à l'eau et résistances
      locales face à la démantèlement des infrastructures urbaines historiques.
    periode_transition: 2040-2080
    evenement_transition: Effondrement partiel des structures étatiques centrales
      après des crises climatiques et sociales répétées, menant à une réorganisation
      autour des bassins fluviaux.
    lieux_emblematiques:
    - Delhi
    - Mumbai
    - Varanasi
    - Bangalore
    relations:
      allies:
      - bassin_danubien
      - chiapas_et_bioterritoires_mesoamericains
      rivaux:
      - enclaves_extractivistes_et_etats_residuels
    sources_attestees: []
