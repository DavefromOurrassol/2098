    description: Réseau décentralisé de bioterritoires autonomes couvrant l'Europe
      de l'Ouest, organisés autour de bassins versants (vallée de l'Ourthe, bassin
      rhénan, Apennins restaurés, Massif Central, Cévennes, Rhône). Chaque communauté
      gère ses ressources locales via des assemblées de bassin et des coopératives,
      en lien avec le réseau Terrafond des Bassins. Les anciennes structures étatiques
      ont cédé la place à des dynamiques locales, bien que des tensions persistent
      avec les enclaves extractivistes résiduelles.
    statut: stable
    tensions_internes: Divergences entre communautés sur le degré d'autonomie locale
      vs. coordination régionale ; résistance des enclaves extractivistes et des fragments
      d'États résiduels ; enjeux d'accueil des populations déplacées des zones désertifiées.
    periode_transition: 2030-2060
    evenement_transition: effondrement_reseau_mondial_communication_eco_communalism
