  proposition:
    slug: japon_archipel_resilient
    nom: Japon — Archipel Résilient
    niveau: 1
    type: union_regionale
    parent: null
    statut: stable
    description: Réseau décentralisé d'îles et de communautés autonomes organisées
      autour de la gestion collective des ressources et de la résilience face aux
      catastrophes naturelles. Les anciennes métropoles ont été réaménagées en grappes
      de villages écologiques interconnectés, avec une forte emphase sur l'autosuffisance
      locale.
    tensions_internes: Conflits entre générations sur l'adoption des technologies
      vertes, et résistances locales à la fragmentation des anciens centres urbains.
    periode_transition: 2030-2060
    evenement_transition: Transition vers l'éco-communalisme après les crises énergétiques
      des années 2030 et les catastrophes naturelles répétées.
    lieux_emblematiques:
    - Tokyo
    - Osaka
    - Kyoto
