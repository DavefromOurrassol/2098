    description: 'Genève en 2098 est un site fortifié abritant les dernières archives
      juridiques et climatiques de l''ère pré-effondrement, convoitées par les blocs
      rivaux. Les structures institutionnelles ont été vidées de leur substance :
      le BCUC n''est plus qu''une coquille disputée entre factions locales, les Archives
      Neutres sont gérées par une milice privée sous contrat avec le Bloc IX, et le
      CRRC n''existe plus que comme label fantôme utilisé pour légitimer des raids
      sur les données. Aucun pouvoir supranational n''y subsiste, seulement des fragments
      de légitimité instrumentalisables.'
    statut: fragmenté
    tensions_internes: Conflits permanents entre la milice archivistique du Bloc IX,
      les mercenaires du Bloc IV chargés de la 'protection' des données, et des groupes
      locaux tentant de monnayer l'accès aux archives. Les anciens fonctionnaires
      survivent comme intermédiaires ou otages.
