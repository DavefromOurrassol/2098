- scenario: policy_reform
  raison: zone_suspecte
  cible: peninsule_iberique_cooperative
  issues: []
  valide: false
  proposition:
    slug: peninsule_iberique_cooperative
    nom: Péninsule Ibérique Coopérative
    type: union_regionale
    origine_reelle:
    - entite: Espagne
      type_entite: pays
      portion: null
    description: Zone née de la réforme territoriale ibérique post-2040, marquée par
      une décentralisation coordonnée entre l'Espagne et le Portugal, et la mutualisation
      des infrastructures énergétiques (réseau solaire-atlantique) et logistiques
      (corridors méditerranéens-atlantiques). Siège du Centre Ibérique de Régulation
      des Flux (CIRF), institution régionale intégrée au CRTI pour la gestion des
      migrations climatiques et des échanges agro-alimentaires, avec une gouvernance
      équilibrée entre pôles secondaires (Valence, Lisbonne, Porto, Barcelone).
    statut: stable
    tensions_internes: Résistances locales aux quotas de redistribution des populations
      climatiques (notamment en Andalousie et Algarve), et rivalités entre pôles urbains
      secondaires pour l'attractivité des investissements régionaux, compensées par
      des mécanismes de péréquation fiscale interrégionale et une planification coordonnée.
    periode_transition: 2038-2052
    lieux_emblematiques:
    - nom: Valence (Pôle Logistique Ibérique)
      type: ville
      notes: Siège du CIRF et hub de redistribution des flux migratoires et commerciaux
        entre Europe et Maghreb Atlantique.
    - nom: Plateforme Solaire de l'Atlantique (PSA)
      type: infrastructure
      notes: Réseau mutualisé de centrales solaires offshore et terrestres, co-géré
        avec le Maghreb Atlantique et l'Europe du Nord-Ouest.
    - nom: Corridor Méditerranéen Ibérique
      type: infrastructure
      notes: Axe ferroviaire et énergétique reliant Almería à Barcelone, intégré aux
        corridors européens de régulation des flux.
    relations:
      allies:
      - maghreb_atlantique
      - europe_nord_ouest
      - hub_europeen_regulation
      rivaux: []
    niveau: 1
    parent: null
    evenement_transition: null
    sources_attestees: []
    promu_depuis: null
