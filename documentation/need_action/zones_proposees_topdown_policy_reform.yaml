    description: Coalition d'États du Sud Global — sahéliens, andins et du Pacifique
      Sud — qui négocient collectivement leur intégration aux mécanismes de gouvernance
      technocratique mondiale, tout en défendant une souveraineté renforcée sur leurs
      ressources, leurs données et leurs choix stratégiques. Ce bloc agit comme un
      contrepoids institutionnalisé, participant aux instances de régulation tout
      en exigeant des réformes structurelles.
    statut: stable
    tensions_internes: 'Hétérogénéité persistante : certains membres privilégient
      une intégration progressive aux institutions internationales, tandis que d''autres
      insistent sur des garanties de souveraineté absolue, notamment en matière de
      gestion des ressources hydriques et énergétiques.'
    periode_transition: 2087-2098
