    description: Bloc continental eurasiatique structuré autour d'une gouvernance
      technocratique décentralisée, intégrée aux mécanismes de régulation internationale
      tout en défendant une approche souveraine des standards technologiques et biologiques.
      Il abrite des institutions comme l'Union Technocratique Eurasiatique, qui participe
      activement au CRTI (siège rotatif à Chengdu), et des pôles de recherche en biotechnologies
      alignés sur les cadres globaux, malgré des divergences sur certains principes
      éthiques.
    statut: stable
    tensions_internes: Débats persistants entre les tenants d'une intégration complète
      aux standards internationaux et les défenseurs d'une souveraineté renforcée
      sur les questions biotech et numériques ; rivalités entre villes secondaires
      pour l'accueil des infrastructures de régulation.
    periode_transition: 2040-2065
    evenement_transition: null
    lieux_emblematiques: []
    relations:
      allies:
