# ── Livres et documents ──────────────────────────────────────────────────
# Mode « dépose et oublie » : tout PDF (avec texte), EPUB, .txt ou .md déposé
# dans dossier_livres est lu automatiquement, SANS entrée ici, par le bouton
# « Signaux faibles — Lire les livres (API) » (veille_livres_api.py, un appel
# LLM par livre, pas de copier-coller). À chaque passe, les pages les plus
# riches en faits concrets (dates, chiffres, lieux, « premier », « pilote »…)
# pas encore lues sont envoyées : le livre est lu en plusieurs passes, puis
# « épuisé ». Options du bouton : Lister les livres, Reprendre au début.
#
# Une entrée ici ne sert qu'aux EXCEPTIONS (repérée par « fichier: ») :
#   actif: false          mettre le livre de côté
#   titre / auteur / annee corriger ce qui est lu dans le fichier
#   pages: "45-80"        PDF : imposer des pages (numéros du lecteur PDF),
#                         envoyées telles quelles à chaque veille
#   chapitres: "3-5"      EPUB : imposer des chapitres
#   max_caracteres: 30000 budget du livre (défaut : 30000, partagé si
#                         plusieurs livres ; 80000 au total)
#   note: "…"             précision affichée à l'IA
# Une entrée SANS « fichier: » est seulement listée dans le prompt web à coller
# (livre à joindre à la main dans l'IA de chat).
# PDF scanné (sans texte) : détecté et signalé, pas encore lu (OCR à venir).
dossier_livres: documentation/livres

