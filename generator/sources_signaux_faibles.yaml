# sources_signaux_faibles.yaml — Ourrassol 2098
# ==============================================
# Liste de départ de la veille « signaux faibles » (concept d'Igor Ansoff).
# Lue par export_prompt_signaux.py (mode manuel, par défaut) et, plus tard,
# par la collecte locale (option 2) et la recherche web par API (option 1).
#
# L'IA reçoit cette liste comme POINT DE DÉPART : elle doit aussi élargir à
# d'autres sources (sauf en collecte locale, qui ne lit que cette liste).
#
# Champs d'une source :
#   nom       : nom lisible
#   url       : page d'accueil ou rubrique à suivre
#   langue    : fr | en | multi
#   famille   : prospective | technologie | geopolitique | climat_energie |
#               sante | societe
#   variables : slugs de variables privilégiées (liste vide = toutes)
#   acces     : libre | partiel (une partie sous abonnement : l'IA ne lira
#               que la partie publique)
#   rss       : adresse du flux RSS, utile seulement pour la collecte locale
#               (option 2) — à renseigner à cette étape
#   verifie   : false tant que l'adresse n'a pas été contrôlée
#   actif     : false pour mettre une source de côté sans la supprimer
#   ajoute_par: david | claude

